services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    # Coolify's own Redis answers to the alias `redis` on the `coolify` network,
    # so any container joining that network resolves the bare name to Coolify's
    # instance rather than to this one. The backup sidecar joins it, so it needs a
    # name only this service holds; the plain `redis` alias stays for the server,
    # which is on the app network alone and cannot hit the collision.
    networks:
      default:
        aliases:
          - mpp-redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Cap WiredTiger so Mongo does not grab ~50% of RAM and collide with the Node
    # heap on the co-located 12 GB box.
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.0"]
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - mongo
    environment:
      MPP_PORT: "8080"
      MPP_REDIS_URL: "redis://redis:6379"
      MPP_MONGO_URL: "mongodb://mongo:27017"
      MPP_MONGO_DB: "mpp"
      # Non-secret runtime config (per-IP WS cap, Node heap, event start) is baked
      # as prod ENV in packages/server/Dockerfile, not passed through here: the
      # Coolify service env holds only secrets. The per-IP cap falls back to its
      # code default (10); the load harness drives >cap bots via --spoof-ip-base.
      # Non-secret app config (puzzle id, asset base, auth host/cookie/origin,
      # Origin allowlist) is baked as prod ENV in packages/server/Dockerfile.
      # docker-compose.override.yml overrides it with localhost values for local
      # dev. This file is what Coolify deploys, so it must not re-declare those
      # keys: a compose `environment:` entry overrides the image ENV, which would
      # silently shadow the baked prod values.
      # Generation seed: the anti-programmatic-solving secret (drives geometry, the
      # scatter, and the wire id permutation), so it is never committed. Passed
      # through from the Coolify service env in prod; docker-compose.override.yml
      # supplies the public alpha value for local dev. The server fails fast if it
      # resolves empty, so a forgotten prod secret stops the boot rather than
      # silently using a publicly derivable permutation.
      MPP_GENERATION_SEED: "${MPP_GENERATION_SEED:-}"
      # Auth secrets: never committed, passed through from the host environment
      # (a local `.env` for `docker compose up`, the Coolify service env in prod).
      # Without AUTH_SECRET the /auth routes fail (sessions unreadable by the
      # SPA); without the Google credentials only Google sign-in is unavailable,
      # guest play still works.
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"
      # Admin page: the shared password gates the direct-URL /admin (empty, the
      # default, leaves it unmounted), and the puzzle switch list carries each
      # puzzle's secret seed. Both are secrets, so they are passed through from the
      # Coolify env like the auth secrets, never baked into the committed image.
      MPP_ADMIN_PASSWORD: "${MPP_ADMIN_PASSWORD:-}"
      MPP_ADMIN_PUZZLES: "${MPP_ADMIN_PUZZLES:-}"
      # Cell compositor write credentials (see DECISIONS: version-suffixed cell
      # composites): the server's one live write path to R2, passed through like
      # the secrets above. All three unset (local dev's default) leaves
      # compositing inert rather than failing the boot, and locked pieces then
      # render as nothing; the bucket is the existing public asset bucket
      # (non-secret, so fixed here, same as MPP_BACKUP_BUCKET below).
      MPP_R2_ENDPOINT: "${MPP_R2_ENDPOINT:-}"
      MPP_R2_ACCESS_KEY_ID: "${MPP_R2_ACCESS_KEY_ID:-}"
      MPP_R2_SECRET_ACCESS_KEY: "${MPP_R2_SECRET_ACCESS_KEY:-}"
      MPP_R2_BUCKET: "mpp-assets"
    expose:
      - "8080"

  # The frontend is not deployed here: prod app.millionpiecepuzzle.com is served
  # by Cloudflare Pages (a production build that reads
  # packages/frontend/.env.production). A Vite dev server for local development
  # lives in docker-compose.override.yml, which Coolify does not deploy.

  # Off-host backups: gzipped dumps of Mongo, Redis, Umami and Coolify pushed to a
  # private R2 bucket every 6h, kept to the newest 3 of each (see DECISIONS:
  # scheduled backups to a private R2 bucket). docker-compose.override.yml
  # disables the loop for local dev (no R2 creds there).
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - mongo
    # Umami's Postgres and Coolify's own Postgres each sit on their own Docker
    # network, so the sidecar joins both on top of the app network to reach them.
    networks:
      - default
      - umami
      - coolify
    # Coolify's state is half database, half filesystem: its APP_KEY, which lives
    # here, is what decrypts the secrets stored in the database, so a dump without
    # this directory restores nothing usable. Read-only, and the same file supplies
    # the Postgres credentials so they need not be duplicated as a service secret.
    volumes:
      - /data/coolify:/host/coolify:ro
    environment:
      # `mpp-redis`, not `redis`: this container joins the `coolify` network, where
      # Coolify's own password-protected Redis holds the `redis` alias and wins the
      # lookup, which fails the RDB pull with NOAUTH. `mongo` needs no such alias,
      # nothing on the joined networks answers to it.
      MPP_REDIS_URL: "redis://mpp-redis:6379"
      MPP_MONGO_URL: "mongodb://mongo:27017"
      MPP_MONGO_DB: "mpp"
      # Cadence and retention: non-secret, baked here as the prod source.
      MPP_BACKUP_INTERVAL_SEC: "21600"
      MPP_BACKUP_KEEP: "3"
      MPP_BACKUP_REMOTE: "r2"
      RCLONE_CONFIG_R2_TYPE: "s3"
      RCLONE_CONFIG_R2_PROVIDER: "Cloudflare"
      RCLONE_CONFIG_R2_ACL: "private"
      # The R2 token is scoped to one bucket, which carries no bucket-level rights,
      # so rclone's default pre-upload HeadBucket/CreateBucket check is refused and
      # it abandons the upload before sending a byte. The bucket is pre-created, so
      # skip the check, same reason as scripts/upload-puzzle.ts's
      # --s3-no-check-bucket. Without this every pass fails on AccessDenied.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      # R2 credentials for the private backup target come from the Coolify service
      # env, never committed: the endpoint carries the account id and the keys are
      # secrets. Without them the backup loop logs failures and the app is
      # unaffected. The bucket name is non-secret, so it is fixed here.
      MPP_BACKUP_BUCKET: "mpp-backups"
      RCLONE_CONFIG_R2_ENDPOINT: "${RCLONE_CONFIG_R2_ENDPOINT:-}"
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}"
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}"
      # Umami's Postgres connection string, a Coolify service secret like the keys
      # above. Unset (local dev's default) skips the Umami dump and leaves the rest
      # of the pass untouched. Coolify's own Postgres needs no equivalent: its
      # credentials are read from the mounted config directory.
      MPP_BACKUP_UMAMI_URL: "${MPP_BACKUP_UMAMI_URL:-}"

volumes:
  redis-data:
  mongo-data:

# Both are created by other stacks on the host, so this file only attaches to
# them. docker-compose.override.yml turns them into ordinary local networks so
# local dev still comes up on a machine where neither exists.
networks:
  umami:
    external: true
    name: umami_default
  coolify:
    external: true
    name: coolify
